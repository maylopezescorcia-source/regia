<style>
  :root{
    --ink:#1B1A21; --soft:#6E6A78; --line:#E9E6EF; --wash:#F7F5FA; --paper:#fff;
    --violet:#6B3FA0; --pink:#D1478F; --grad:linear-gradient(135deg,var(--violet),var(--pink));
    --ok:#2B8A62; --bad:#C23D3A; --r:16px;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.45;}
  h1,h2,h3{font-family:'Jost','Inter',sans-serif;font-weight:500;margin:0;letter-spacing:.005em;}
  button{font:inherit;color:inherit;cursor:pointer;}
  img{display:block;max-width:100%;}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* cabecera */
  .aviso{background:var(--grad);color:#fff;text-align:center;font-size:13px;padding:8px 16px;}
  header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
  .top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;}
  .brand img{height:52px;width:auto;}
  .grow{flex:1;}
  .search{position:relative;flex:1;max-width:340px;margin-left:auto;}
  .search input{width:100%;border:1px solid var(--line);background:var(--wash);border-radius:999px;padding:10px 16px 10px 40px;font:inherit;font-size:14px;}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--soft);fill:none;stroke-width:1.8;stroke-linecap:round;}
  .bag{position:relative;width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;flex-shrink:0;transition:transform .15s var(--ease);}
  .bag:active{transform:scale(.94);}
  .bag svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .bag .n{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--grad);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid #fff;}
  .bag .n[hidden]{display:none;}
  @media(max-width:620px){ .brand img{height:44px;} .search{max-width:none;} }

  /* categorías */
  .cats{max-width:1180px;margin:0 auto;padding:14px 16px 4px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
  .cats::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:500;color:var(--soft);transition:all .15s var(--ease);}
  .chip:hover{border-color:var(--violet);color:var(--violet);}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;}

  main{max-width:1180px;margin:0 auto;padding:12px 16px 80px;}
  .count{font-size:13px;color:var(--soft);margin:6px 0 14px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 12px;}
  @media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:28px 18px;}}
  @media(min-width:1040px){.grid{grid-template-columns:repeat(4,1fr);}}
  .card{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;align-self:start;text-align:left;background:none;border:0;padding:0;width:100%;}
  .ph{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--wash);}
  .ph img{width:100%;height:100%;object-fit:contain;object-position:center;transition:transform .5s var(--ease);}
  @media(hover:hover){.card:hover .ph img{transform:scale(1.04);}}
  .ph.vacio{display:grid;place-items:center;}
  .ph.vacio img{width:46%;height:auto;opacity:.18;object-fit:contain;}
  .tag{position:absolute;left:10px;top:10px;background:#fff;border-radius:999px;font-size:11.5px;font-weight:600;padding:4px 10px;color:var(--ink);}
  .tag.ultimas{color:var(--pink);}
  .agotado .ph img{filter:grayscale(1);opacity:.55;}
  .agotado .tag{background:var(--ink);color:#fff;}
  .card .nm{margin-top:10px;font-size:14.5px;font-weight:500;line-height:1.3;}
  .card .pr{font-family:'Jost',sans-serif;font-size:17px;font-weight:500;margin-top:2px;}
  .card .sz{font-size:12px;color:var(--soft);margin-top:1px;}
  .vacio-msg{text-align:center;color:var(--soft);padding:70px 16px;}
  .vacio-msg h2{font-size:22px;color:var(--ink);margin-bottom:6px;}
  .cerrada{background:var(--wash);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:6px 0 16px;font-size:14px;}
  .skeleton .ph{animation:pulse 1.2s ease-in-out infinite alternate;}
  @keyframes pulse{from{opacity:.55}to{opacity:1}}

  /* hojas (producto y bolsa) */
  .scrim{position:fixed;inset:0;background:rgba(27,26,33,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s var(--ease);}
  .scrim.on{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;z-index:41;background:#fff;display:flex;flex-direction:column;visibility:hidden;transition:transform .32s var(--ease),visibility 0s .32s;}
  .sheet.on{visibility:visible;transition:transform .32s var(--ease);}
  .sheet-prod{left:0;right:0;bottom:0;max-height:94dvh;border-radius:22px 22px 0 0;transform:translateY(102%);}
  .sheet-prod.on{transform:none;}
  .sheet-bag{top:0;right:0;bottom:0;width:min(440px,100%);transform:translateX(102%);}
  .sheet-bag.on{transform:none;}
  @media(min-width:860px){
    .sheet-prod{left:50%;right:auto;bottom:auto;top:50%;width:min(900px,92vw);max-height:90vh;border-radius:22px;transform:translate(-50%,-46%);opacity:0;transition:transform .3s var(--ease),opacity .25s,visibility 0s .3s;}
    .sheet-prod.on{transform:translate(-50%,-50%);opacity:1;transition:transform .3s var(--ease),opacity .25s;}
  }
  .sh-close{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(27,26,33,.18);z-index:3;display:grid;place-items:center;font-size:22px;line-height:1;}
  .prod-body{overflow:auto;display:grid;grid-template-columns:1fr;}
  @media(min-width:860px){.prod-body{grid-template-columns:1.05fr 1fr;overflow:hidden;max-height:90vh;}}
  .gal{position:relative;background:var(--wash);}
  .gal-main{aspect-ratio:3/4;width:100%;overflow:hidden;background:var(--wash);}
  @media(min-width:860px){.gal-main{aspect-ratio:auto;height:calc(90vh - 90px);}}
  @media(max-width:859px){.gal-main{aspect-ratio:auto;height:min(64dvh,560px);}}
  .gal-main img{width:100%;height:100%;object-fit:contain;object-position:center;}
  .gal-th{display:flex;gap:8px;padding:10px;overflow-x:auto;}
  .gal-th button{width:56px;height:70px;flex-shrink:0;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--wash);}
  .gal-th button[aria-current="true"]{border-color:var(--violet);}
  .gal-th img{width:100%;height:100%;object-fit:contain;}
  .info{padding:22px 22px 26px;overflow:auto;}
  @media(min-width:860px){.info{padding:34px 32px;}}
  .info h2{font-size:26px;line-height:1.15;padding-right:34px;}
  .info .precio{font-family:'Jost',sans-serif;font-size:24px;margin:8px 0 12px;}
  .info .desc{color:#4A4755;font-size:14.5px;white-space:pre-line;margin-bottom:18px;}
  .opt-t{font-size:13px;font-weight:600;margin:16px 0 8px;}
  .opt-t span{font-weight:400;color:var(--soft);}
  .opts{display:flex;flex-wrap:wrap;gap:8px;}
  .opt{min-width:46px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-size:14px;font-weight:500;transition:all .12s;}
  .opt:hover:not(:disabled){border-color:var(--ink);}
  .opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff;}
  .opt-img{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;}
  .opt-img img{width:30px;height:38px;object-fit:cover;border-radius:7px;}
  .opt-img:disabled img{filter:grayscale(1);opacity:.5;}
  .card .cl{font-size:12px;color:var(--soft);margin-top:1px;}
  .opt:disabled{color:#B8B4C0;text-decoration:line-through;cursor:not-allowed;background:var(--wash);}
  .stock-note{font-size:12.5px;margin-top:10px;color:var(--soft);min-height:18px;}
  .stock-note.ultimas{color:var(--pink);font-weight:600;}
  .buy{display:flex;gap:10px;margin-top:18px;align-items:center;}
  .qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;}
  .qty button{width:38px;height:44px;border:0;background:none;font-size:19px;}
  .qty button:disabled{opacity:.3;cursor:not-allowed;}
  .qty span{min-width:26px;text-align:center;font-weight:600;}
  .btn{border:0;border-radius:14px;padding:14px 22px;font-weight:600;font-size:15px;transition:transform .12s var(--ease),filter .15s;}
  .btn:active:not(:disabled){transform:scale(.98);}
  .btn.pri{background:var(--grad);color:#fff;flex:1;box-shadow:0 10px 22px -12px var(--violet);}
  .btn.pri:hover:not(:disabled){filter:brightness(1.06);}
  .btn.dark{background:var(--ink);color:#fff;}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
  .btn.wa{background:#1FAF55;color:#fff;}

  /* bolsa */
  .bag-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);}
  .bag-h h2{font-size:22px;}
  .bag-h .x{width:36px;height:36px;border-radius:50%;border:0;background:var(--wash);font-size:20px;}
  .bag-b{flex:1;overflow:auto;padding:6px 20px 20px;}
  .bag-f{padding:14px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;}
  .ln{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .ln .im{width:68px;height:84px;border-radius:10px;overflow:hidden;background:var(--wash);flex-shrink:0;}
  .ln .im img{width:100%;height:100%;object-fit:contain;}
  .ln .d{flex:1;min-width:0;}
  .ln .d b{font-weight:500;display:block;font-size:14.5px;}
  .ln .d small{color:var(--soft);font-size:12.5px;}
  .ln .d .alerta{color:var(--bad);font-size:12px;margin-top:2px;}
  .ln .row2{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .ln .qty button{height:34px;width:32px;font-size:17px;}
  .ln .qty{border-radius:10px;}
  .ln .lp{font-family:'Jost',sans-serif;font-size:16px;}
  .ln .rm{border:0;background:none;color:var(--soft);font-size:12px;text-decoration:underline;padding:0;margin-left:10px;}
  .tot{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;}
  .tot.g{font-family:'Jost',sans-serif;font-size:21px;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;}
  .bag-vacia{text-align:center;color:var(--soft);padding:60px 10px;}
  .free{font-size:12.5px;color:var(--ok);margin:8px 0 2px;}
  .pend{font-size:12.5px;color:var(--soft);margin:8px 0 2px;}

  /* formulario */
  .f{margin-top:14px;}
  .f label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;}
  .f label i{font-weight:400;color:var(--soft);font-style:normal;}
  .f input,.f textarea,.f select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;background:#fff;}
  .f input:focus,.f textarea:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px rgba(107,63,160,.14);}
  .f .err{color:var(--bad);font-size:12.5px;margin-top:4px;}
  .f input[aria-invalid="true"]{border-color:var(--bad);}
  .pick{display:grid;gap:8px;}
  .pickopt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14px;font-weight:500;}
  .pickopt input{width:auto;padding:0;border:0;box-shadow:none;margin:3px 0 0;accent-color:var(--violet);}
  .pickopt:has(input:checked){border-color:var(--ink);background:var(--wash);}
  .pickopt small{display:block;font-weight:400;color:var(--soft);font-size:12.5px;}
  .hp{position:absolute;left:-9999px;opacity:0;height:0;}
  .errbox{background:#FCE8E6;color:var(--bad);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-top:12px;}

  /* confirmación */
  .done{padding:34px 22px;text-align:center;overflow:auto;flex:1;}
  .done .ck{width:64px;height:64px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin:0 auto 16px;font-size:30px;}
  .done h2{font-size:26px;}
  .done .cod{font-family:'Jost',sans-serif;font-size:30px;letter-spacing:.06em;margin:12px 0 4px;}
  .done p{color:#4A4755;font-size:14.5px;margin:8px auto;max-width:34ch;}
  .pago{background:var(--wash);border-radius:14px;padding:14px 16px;text-align:left;font-size:14px;white-space:pre-line;margin:16px 0;}
  .pago b{display:block;font-size:13px;margin-bottom:4px;}
  .done .btn{width:100%;margin-top:10px;}
  footer{border-top:1px solid var(--line);padding:26px 16px 40px;text-align:center;color:var(--soft);font-size:13px;}
  footer img{height:40px;margin:0 auto 8px;opacity:.9;}
  .toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-20px);background:var(--ink);color:#fff;border-radius:12px;padding:12px 18px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:all .25s var(--ease);max-width:calc(100vw - 32px);}
  .toast.on{opacity:1;transform:translate(-50%,0);}
  body.lock{overflow:hidden;}
  @media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
  #fallo{display:none;max-width:480px;margin:90px auto;padding:0 20px;text-align:center;}
</style>
</head>
<body>
<div id="aviso" class="aviso" hidden></div>
<header class="top">
  <div class="top-in">
    <button class="brand" onclick="irInicio()" aria-label="Ir al inicio"><img id="logo-top" alt="Regia by cm"></button>
    <label class="search"><span class="sr">Buscar</span>
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar prendas" autocomplete="off">
    </label>
    <button class="bag" id="btn-bag" aria-label="Abrir mi bolsa"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span class="n" id="bag-n" hidden>0</span></button>
  </div>
  <nav class="cats" id="cats" aria-label="Categorías"></nav>
</header>

<main id="main">
  <div id="cerrada" class="cerrada" hidden></div>
  <div class="count" id="count" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
</main>
<div id="fallo"><h2>La tienda no está disponible</h2><p style="color:var(--soft)" id="fallo-t">Intenta de nuevo en unos minutos.</p></div>
<footer><img id="logo-foot" alt=""><div id="foot-txt"></div></footer>

<div class="scrim" id="scrim"></div>
<section class="sheet sheet-prod" id="sheet-prod" role="dialog" aria-modal="true" aria-label="Producto"></section>
<aside class="sheet sheet-bag" id="sheet-bag" role="dialog" aria-modal="true" aria-label="Mi bolsa"></aside>
<div class="toast" id="toast" role="status"></div>

const $=id=>document.getElementById(id);

function guardarBolsa(){ try{ localStorage.setItem('regia_bolsa', JSON.stringify(CART)); }catch(e){} actualizarBolsaN(); }
function actualizarBolsaN(){ const n=CART.reduce((s,l)=>s+l.cantidad,0); const b=$('bag-n'); b.textContent=n; b.hidden=!n; }

/* ---------- conexión ---------- */
function iniciar(){
  if(!CFGT || !CFGT.firebaseConfig || !CFGT.storeCode || window.__sinConfig){
    $('main').hidden=true; $('fallo').style.display='block'; $('fallo-t').textContent='Esta tienda todavía no está configurada.'; return;
  }
  try{
    firebase.initializeApp(CFGT.firebaseConfig);
    db=firebase.firestore(); baseRef=db.collection('tiendas').doc(CFGT.storeCode);
  }catch(e){ console.error(e); $('main').hidden=true; $('fallo').style.display='block'; return; }
  pintarEsqueleto();
  baseRef.collection('config').doc('publica').onSnapshot(d=>{
    if(d.exists) CFG=Object.assign(CFG,d.data());
    aplicarConfig(); render();
  }, e=>console.error(e));
  baseRef.collection('productos').onSnapshot(snap=>{
    PRODS=snap.docs.map(d=>d.data());
    cargado=true; revisarBolsa(); render(); abrirDesdeLink();
    if(prodAbierto){ const p=PRODS.find(x=>x.id===prodAbierto.id); if(p){ prodAbierto=p; pintarProducto(true); cargarFotosProducto(p); } }
    if($('sheet-bag').classList.contains('on') && paso==='bolsa') pintarBolsa();
  }, e=>{ console.error(e); cargado=true; $('count').textContent='No pudimos cargar el catálogo. Revisa tu conexión e intenta de nuevo.'; });
}
function aplicarConfig(){
  const av=$('aviso'); av.hidden=!CFG.aviso; av.textContent=CFG.aviso||'';
  const c=$('cerrada'); c.hidden=!!CFG.abierta; c.textContent='La tienda está cerrada por el momento. Puedes mirar el catálogo y volver pronto.';
  document.title=(CFG.nombre||'Tienda')+' · Tienda';
  $('foot-txt').textContent=(CFG.nombre||'')+(CFG.direccionTienda?' · '+CFG.direccionTienda:'');
}

/* ---------- catálogo ---------- */
function stockTotal(p){ return p.variantes.reduce((s,v)=>s+v.stock,0); }
function pintarEsqueleto(){ $('grid').innerHTML=Array.from({length:8}).map(()=>'<div class="card skeleton"><div class="ph"></div><div class="nm">&nbsp;</div></div>').join(''); }
function render(){
  if(!cargado) return;
  const cats=['Todo',...[...new Set(PRODS.map(p=>p.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'))];
  if(!cats.includes(categoria)) categoria='Todo';
  $('cats').innerHTML=cats.length>2?cats.map(c=>`<button class="chip" aria-pressed="${c===categoria}" data-c="${esc(c)}">${esc(c)}</button>`).join(''):'';
  const q=texto.trim().toLowerCase();
  let lista=PRODS.filter(p=>(categoria==='Todo'||p.categoria===categoria) && (!q||(p.nombre+' '+(p.categoria||'')+' '+(p.descripcion||'')).toLowerCase().includes(q)));
  lista.sort((a,b)=>{ const sa=stockTotal(a)>0?0:1, sb=stockTotal(b)>0?0:1; return sa-sb || (b.publicadoEn||0)-(a.publicadoEn||0) || a.nombre.localeCompare(b.nombre,'es'); });
  $('count').textContent=lista.length? (lista.length+(lista.length===1?' prenda':' prendas')) : '';
  if(!lista.length){
    $('grid').innerHTML=`<div class="vacio-msg" style="grid-column:1/-1"><h2>${PRODS.length?'No encontramos nada con eso':'Pronto tendremos prendas nuevas'}</h2><p>${PRODS.length?'Prueba con otra palabra o mira todas las categorías.':'Estamos subiendo el catálogo. Vuelve en un rato.'}</p></div>`; return;
  }
  $('grid').innerHTML=lista.map(p=>{
    const st=stockTotal(p), agotado=st<=0;
    const tallas=[...new Set(p.variantes.filter(v=>v.stock>0).map(v=>v.talla))].filter(t=>t!=='Única').sort(ordenTallas);
    const nCol=[...new Set(p.variantes.filter(v=>v.stock>0).map(v=>v.color))].filter(c=>c!=='Único').length;
    return `<button class="card ${agotado?'agotado':''}" data-id="${esc(p.id)}" aria-label="${esc(p.nombre)}, ${fmt(p.precio)}">
      <div class="ph ${p.thumb?'':'vacio'}">${p.thumb?`<img src="${esc(p.thumb)}" alt="" loading="lazy">`:`<img src="${LOGO}" alt="">`}
      ${agotado?'<span class="tag">Agotado</span>':(st<=3?'<span class="tag ultimas">Últimas unidades</span>':'')}</div>
      <div class="nm">${esc(p.nombre)}</div><div class="pr">${fmt(p.precio)}</div>${tallas.length?`<div class="sz">${esc(tallas.join(' · '))}</div>`:''}${nCol>1?`<div class="cl">${nCol} colores</div>`:''}</button>`;
  }).join('');
}
$('cats').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; categoria=b.dataset.c; render(); });
$('grid').addEventListener('click',e=>{ const c=e.target.closest('.card[data-id]'); if(c) abrirProducto(c.dataset.id); });
$('q').addEventListener('input',e=>{ texto=e.target.value; render(); });
function irInicio(){ categoria='Todo'; texto=''; $('q').value=''; render(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ---------- hojas ---------- */
function abrirHoja(id){ $(id).classList.add('on'); $('scrim').classList.add('on'); document.body.classList.add('lock'); }
function cerrarHojas(){ if(prodAbierto){ try{ history.replaceState(null,'',location.pathname); }catch(e){} } ['sheet-prod','sheet-bag'].forEach(i=>$(i).classList.remove('on')); $('scrim').classList.remove('on'); document.body.classList.remove('lock'); prodAbierto=null; }
$('scrim').addEventListener('click',cerrarHojas);
function slugDe(t){ return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function claveLink(p){ const sl=slugDe(p.nombre); return sl && PRODS.filter(x=>slugDe(x.nombre)===sl).length===1 ? sl : p.id; }
function linkProducto(p){ return location.origin+location.pathname+'?p='+encodeURIComponent(claveLink(p)); }
let linkPendiente=null; try{ linkPendiente=new URLSearchParams(location.search).get('p'); }catch(e){}
function abrirDesdeLink(){
  if(!linkPendiente || !cargado) return;
  const k=linkPendiente; linkPendiente=null;
  const p=PRODS.find(x=>x.id===k) || PRODS.find(x=>slugDe(x.nombre)===slugDe(k));
  if(p) abrirProducto(p.id); else { toast('Ese producto ya no está disponible. Mira lo que tenemos.'); try{ history.replaceState(null,'',location.pathname); }catch(e){} }
}
async function compartirProducto(){
  const p=prodAbierto; if(!p) return;
  const url=linkProducto(p), texto=p.nombre+' · '+fmt(p.precio);
  if(navigator.share){ try{ await navigator.share({title:p.nombre, text:texto, url}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(url); toast('Link copiado. Pégalo donde quieras compartirlo.'); }
  catch(e){ prompt('Copia este link:', url); }
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') cerrarHojas(); });

/* ---------- producto ---------- */
async function abrirProducto(id){
  const p=PRODS.find(x=>x.id===id); if(!p) return;
  prodAbierto=p; galIdx=0; selQty=1;
  try{ history.replaceState(null,'',location.pathname+'?p='+encodeURIComponent(claveLink(p))); }catch(e){}
  const col=[...new Set(p.variantes.filter(v=>v.stock>0).map(v=>v.color))];
  selColor=col.length===1?col[0]:null;
  const todosColores=[...new Set(p.variantes.map(v=>v.color))];
  if(todosColores.length===1) selColor=todosColores[0];
  selTalla=null; autoTalla();
  pintarProducto(false); abrirHoja('sheet-prod');
  await cargarFotosProducto(p);
}
// Trae las fotos de la nube; si la prenda cambió de fotos (fotosV), las vuelve a pedir
async function cargarFotosProducto(p){
  const k=p.id+'|'+(p.fotosV||0)+'|'+(p.nFotos||0);
  if(!(p.nFotos>0) || fotosCache[p.id+'_k']===k) return;
  fotosCache[p.id+'_k']=k;
  try{ const d=await baseRef.collection('fotos').doc(p.id).get(); const dd=d.exists?d.data():{}; fotosCache[p.id]=(dd.imgs||[]).map((src,i)=>({src,color:((dd.colores||[])[i])||''})); }
  catch(e){ console.error(e); delete fotosCache[p.id+'_k']; }
  if(prodAbierto && prodAbierto.id===p.id) pintarProducto(true);
}
function autoTalla(){
  const p=prodAbierto; if(!p) return;
  const tallas=[...new Set(p.variantes.filter(v=>(!selColor||v.color===selColor)).map(v=>v.talla))];
  if(tallas.length===1) selTalla=tallas[0];
  else if(selTalla && !p.variantes.some(v=>v.color===selColor&&v.talla===selTalla&&v.stock>0)) selTalla=null;
}
function varianteSel(){ const p=prodAbierto; if(!(p&&selColor&&selTalla)) return null; const m=p.variantes.filter(v=>v.color===selColor&&v.talla===selTalla).sort((a,b)=>b.stock-a.stock); return m[0]||null; }
const ORDEN_TALLAS=['XXS','XS','S','M','L','XL','XXL','XXXL','2XL','3XL','4XL'];
function ordenTallas(a,b){ const A=String(a).toUpperCase().trim(), B=String(b).toUpperCase().trim(); const ia=ORDEN_TALLAS.indexOf(A), ib=ORDEN_TALLAS.indexOf(B);
  if(ia>=0&&ib>=0) return ia-ib; const na=parseFloat(A), nb=parseFloat(B); if(!isNaN(na)&&!isNaN(nb)) return na-nb; if(ia>=0) return -1; if(ib>=0) return 1; return A.localeCompare(B,'es'); }
function pintarProducto(conservar){
  const p=prodAbierto; if(!p) return;
  const nube=fotosCache[p.id]||[], fc=p.fotosColor||{};
  const generales=nube.filter(f=>!f.color).map(f=>f.src);
  let fotos;
  if(selColor){
    // color elegido: sus fotos (frente, espalda…) + las generales
    const propias=nube.filter(f=>f.color===selColor).map(f=>f.src);
    const base=propias.length? propias : [fc[selColor]||p.thumb].filter(Boolean);
    fotos=[...base, ...generales];
  } else {
    // sin color elegido: la portada de cada color + las generales
    const cols=[...new Set(p.variantes.map(v=>v.color))];
    const portadas=cols.map(c=>{ const f=nube.find(x=>x.color===c); return f?f.src:(fc[c]||''); }).filter(Boolean);
    fotos=[...(portadas.length?portadas:[p.thumb].filter(Boolean)), ...generales];
  }
  fotos=fotos.filter((x,i)=>fotos.indexOf(x)===i);
  if(galIdx>=fotos.length) galIdx=0;
  const colores=[...new Set(p.variantes.map(v=>v.color))], conColor=!(colores.length===1&&colores[0]==='Único');
  const tallasAll=[...new Set(p.variantes.map(v=>v.talla))], conTalla=!(tallasAll.length===1&&tallasAll[0]==='Única');
  const v=varianteSel(); const disp=v?v.stock:0;
  if(selQty>Math.max(1,disp)) selQty=Math.max(1,disp);
  const agotado=stockTotal(p)<=0;
  const cerrada=!CFG.abierta;
  const colorHtml=conColor?`<div class="opt-t">Color <span>${esc(selColor||'elige uno')}</span></div><div class="opts">${colores.map(c=>{ const hay=p.variantes.some(x=>x.color===c&&x.stock>0); const fcm=(p.fotosColor||{})[c]; return `<button class="opt${fcm?' opt-img':''}" data-color="${esc(c)}" aria-pressed="${c===selColor}" ${hay?'':'disabled'}>${fcm?`<img src="${esc(fcm)}" alt="">`:''}${esc(c)}</button>`; }).join('')}</div>`:'';
  const tallasMostrar=(conColor&&selColor? [...new Set(p.variantes.filter(x=>x.color===selColor).map(x=>x.talla))] : tallasAll).slice().sort(ordenTallas);
  const tallaHtml=conTalla?`<div class="opt-t">Talla <span>${esc(selTalla||'elige una')}</span></div><div class="opts">${tallasMostrar.map(t=>{ const hay=p.variantes.some(x=>(!conColor||!selColor||x.color===selColor)&&x.talla===t&&x.stock>0); return `<button class="opt" data-talla="${esc(t)}" aria-pressed="${t===selTalla}" ${hay?'':'disabled'}>${esc(t)}</button>`; }).join('')}</div>`:'';
  let nota='';
  if(agotado) nota='Esta prenda está agotada por ahora.';
  else if(v && v.stock<=3) nota=`Quedan ${v.stock} ${v.stock===1?'unidad':'unidades'}`;
  else if((conColor&&!selColor)||(conTalla&&!selTalla)) nota='Elige '+[conColor&&!selColor?'el color':'',conTalla&&!selTalla?'la talla':''].filter(Boolean).join(' y ')+' para continuar';
  const puede=!!v && v.stock>0 && !cerrada;
  $('sheet-prod').innerHTML=`<button class="sh-close" onclick="cerrarHojas()" aria-label="Cerrar">×</button>
  <div class="prod-body">
    <div class="gal"><div class="gal-main">${fotos.length?`<img src="${esc(fotos[galIdx])}" alt="${esc(p.nombre)}">`:`<div class="ph vacio" style="height:100%;border-radius:0"><img src="${LOGO}" alt=""></div>`}</div>
      ${fotos.length>1?`<div class="gal-th">${fotos.map((f,i)=>`<button data-g="${i}" aria-label="Foto ${i+1}" aria-current="${i===galIdx}"><img src="${esc(f)}" alt=""></button>`).join('')}</div>`:''}</div>
    <div class="info"><h2>${esc(p.nombre)}</h2><div class="precio">${fmt(v?v.precio:p.precio)}</div>
      ${p.descripcion?`<div class="desc">${esc(p.descripcion)}</div>`:''}
      ${colorHtml}${tallaHtml}
      <div class="stock-note ${v&&v.stock<=3&&v.stock>0?'ultimas':''}">${esc(nota)}</div>
      ${cerrada?'<div class="cerrada" style="margin-top:12px">La tienda está cerrada por ahora.</div>':''}
      <div class="buy"><div class="qty"><button data-q="-1" aria-label="Menos" ${selQty<=1||!v?'disabled':''}>−</button><span>${selQty}</span><button data-q="1" aria-label="Más" ${!v||selQty>=disp?'disabled':''}>+</button></div>
      <button class="btn pri" id="btn-add" ${puede?'':'disabled'}>Agregar a la bolsa</button></div>
      <button class="btn ghost" id="btn-share" style="width:100%;margin-top:10px;font-size:14px">Compartir esta prenda</button>
    </div></div>`;
}
$('sheet-prod').addEventListener('click',e=>{
  const p=prodAbierto; if(!p) return;
  const c=e.target.closest('[data-color]'), t=e.target.closest('[data-talla]'), g=e.target.closest('[data-g]'), q=e.target.closest('[data-q]');
  if(c){ selColor=c.dataset.color; selTalla=null; autoTalla(); selQty=1; galIdx=0; pintarProducto(); }
  else if(t){ selTalla=t.dataset.talla; selQty=1; pintarProducto(); }
  else if(g){ galIdx=+g.dataset.g; pintarProducto(); }
  else if(q){ selQty=Math.max(1,selQty+(+q.dataset.q)); pintarProducto(); }
  else if(e.target.closest('#btn-add')) agregarABolsa();
  else if(e.target.closest('#btn-share')) compartirProducto();
});
function agregarABolsa(){
  const p=prodAbierto, v=varianteSel(); if(!p||!v||!CFG.abierta) return;
  const ex=CART.find(l=>l.vid===v.id);
  const ya=ex?ex.cantidad:0;
  const cant=Math.min(selQty, v.stock-ya);
  if(cant<=0){ toast('Ya tienes todas las unidades disponibles en tu bolsa'); return; }
  if(ex) ex.cantidad+=cant; else CART.push({pid:p.id,vid:v.id,cantidad:cant});
  guardarBolsa(); cerrarHojas(); toast('Agregado a tu bolsa'); 
}

/* ---------- bolsa ---------- */
function buscar(l){ const p=PRODS.find(x=>x.id===l.pid); const v=p&&p.variantes.find(x=>x.id===l.vid); return p&&v?{p,v}:null; }
function revisarBolsa(){
  let cambio=false;
  CART=CART.filter(l=>{ const r=buscar(l); if(!r||r.v.stock<=0){ cambio=true; return false; } if(l.cantidad>r.v.stock){ l.cantidad=r.v.stock; cambio=true; } return true; });
  if(cambio){ guardarBolsa(); } else actualizarBolsaN();
}
function totales(entrega){
  const sub=CART.reduce((s,l)=>{ const r=buscar(l); return s+(r?r.v.precio*l.cantidad:0); },0);
  let envio=0;
  if(entrega==='envio' && CFG.envioActivo){ envio=(CFG.envioGratisDesde>0 && sub>=CFG.envioGratisDesde)?0:(CFG.costoEnvio||0); }
  return {sub,envio,total:sub+envio};
}
$('btn-bag').addEventListener('click',()=>{ paso='bolsa'; pintarBolsa(); abrirHoja('sheet-bag'); });
function cabBolsa(t,atras){ return `<div class="bag-h">${atras?`<button class="x" id="b-atras" aria-label="Volver">‹</button>`:''}<h2>${t}</h2><button class="x" onclick="cerrarHojas()" aria-label="Cerrar">×</button></div>`; }
function pintarBolsa(){
  const sh=$('sheet-bag');
  if(!CART.length){
    sh.innerHTML=cabBolsa('Mi bolsa')+`<div class="bag-b"><div class="bag-vacia"><h2 style="color:var(--ink);font-size:20px;margin-bottom:6px">Tu bolsa está vacía</h2><p>Elige una prenda y se guarda aquí.</p><button class="btn dark" style="margin-top:12px" onclick="cerrarHojas()">Ver prendas</button></div></div>`; return;
  }
  const t=totales('recoger');
  const falta=CFG.envioActivo&&CFG.envioGratisDesde>0? CFG.envioGratisDesde-t.sub : 0;
  sh.innerHTML=cabBolsa('Mi bolsa')+`<div class="bag-b">${CART.map((l,i)=>{ const r=buscar(l); if(!r) return ''; const img=(r.p.fotosColor||{})[r.v.color]||r.p.thumb;
    return `<div class="ln"><div class="im">${img?`<img src="${esc(img)}" alt="">`:''}</div><div class="d"><b>${esc(r.p.nombre)}</b><small>${[r.v.talla!=='Única'?'Talla '+esc(r.v.talla):'',r.v.color!=='Único'?esc(r.v.color):''].filter(Boolean).join(' · ')}</small>
      <div class="row2"><div style="display:flex;align-items:center"><div class="qty"><button data-m="${i}" data-d="-1" aria-label="Menos">−</button><span>${l.cantidad}</span><button data-m="${i}" data-d="1" aria-label="Más" ${l.cantidad>=r.v.stock?'disabled':''}>+</button></div><button class="rm" data-r="${i}">Quitar</button></div><span class="lp">${fmt(r.v.precio*l.cantidad)}</span></div></div></div>`; }).join('')}
    ${falta>0&&falta<=CFG.envioGratisDesde?`<div class="pend">Te faltan ${fmt(falta)} para envío gratis.</div>`:''}
    ${CFG.envioGratisDesde>0&&falta<=0&&CFG.envioActivo?'<div class="free">¡Tu envío es gratis!</div>':''}
  </div><div class="bag-f"><div class="tot"><span>Subtotal</span><span>${fmt(t.sub)}</span></div><div class="tot" style="color:var(--soft);font-size:12.5px"><span>El envío se calcula al finalizar</span></div>
  <button class="btn pri" style="width:100%;margin-top:10px" id="b-seguir" ${CFG.abierta?'':'disabled'}>${CFG.abierta?'Continuar con mi pedido':'Tienda cerrada'}</button></div>`;
}
$('sheet-bag').addEventListener('click',e=>{
  const m=e.target.closest('[data-m]'), r=e.target.closest('[data-r]');
  if(m){ const l=CART[+m.dataset.m]; l.cantidad+=(+m.dataset.d); if(l.cantidad<=0) CART.splice(+m.dataset.m,1); guardarBolsa(); pintarBolsa(); }
  else if(r){ CART.splice(+r.dataset.r,1); guardarBolsa(); pintarBolsa(); }
  else if(e.target.closest('#b-seguir')){ paso='datos'; pintarDatos(); }
  else if(e.target.closest('#b-atras')){ paso='bolsa'; pintarBolsa(); }
  else if(e.target.closest('#b-enviar')) enviarPedido();
});

/* ---------- datos del pedido ---------- */
let FORM={nombre:'',telefono:'',correo:'',cedula:'',entrega:'',direccion:'',ciudad:'',medioPago:'',notas:''};
try{ Object.assign(FORM, JSON.parse(localStorage.getItem('regia_datos')||'{}'), {notas:'',medioPago:'',entrega:''}); }catch(e){}
function entregas(){ const a=[]; if(CFG.envioActivo) a.push('envio'); if(CFG.retiroEnTienda) a.push('recoger'); return a.length?a:['recoger']; }

    ${FORM.entrega==='envio'?campo('direccion','Dirección de entrega','text','autocomplete="street-address" maxlength="120"')+campo('ciudad','Ciudad','text','autocomplete="address-level2" maxlength="60"'):''}
    <div class="f"><label>Forma de pago</label>${E.medioPago?`<div class="err">${esc(E.medioPago)}</div>`:''}<div class="pick">

  </div><div class="bag-f"><div class="tot"><span>Subtotal</span><span>${fmt(t.sub)}</span></div>
    ${FORM.entrega==='envio'?`<div class="tot"><span>Envío</span><span>${t.envio?fmt(t.envio):'Gratis'}</span></div>`:''}
    <div class="tot g"><span>Total</span><span>${fmt(t.total)}</span></div>
    <button class="btn pri" style="width:100%;margin-top:10px" id="b-enviar" ${enviando?'disabled':''}>${enviando?'Enviando…':'Hacer pedido'}</button>
    <p style="font-size:12px;color:var(--soft);margin:8px 0 0;text-align:center">Te confirmamos disponibilidad y pago por WhatsApp.</p></div>`;
}
function leerForm(){
  ['nombre','telefono','correo','cedula','direccion','ciudad','notas'].forEach(k=>{ const el=$('f-'+k); if(el) FORM[k]=el.value; });
  const en=document.querySelector('input[name=ent]:checked'); if(en) FORM.entrega=en.value;
  const pg=document.querySelector('input[name=pay]:checked'); if(pg) FORM.medioPago=pg.value;
}
$('sheet-bag').addEventListener('change',e=>{ if(paso==='datos' && (e.target.name==='ent'||e.target.name==='pay')){ leerForm(); pintarDatos(); } });
function limpio(s,max){ return String(s||'').replace(/[\u0000-\u001f<>`]/g,' ').replace(/\s+/g,' ').trim().slice(0,max); }
function codigoPedido(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c='RG-'; const r=new Uint32Array(5); (crypto&&crypto.getRandomValues?crypto.getRandomValues(r):r.forEach((_,i)=>r[i]=Math.random()*1e9)); for(let i=0;i<5;i++) c+=a[r[i]%a.length]; return c; }
async function enviarPedido(){
  if(enviando) return; leerForm();
  if($('f-web') && $('f-web').value) return; // trampa para robots
  const E={};
  const nombre=limpio(FORM.nombre,80), tel=limpio(FORM.telefono,20).replace(/[^\d+ ]/g,''), digs=tel.replace(/\D/g,'');
  if(nombre.length<3) E.nombre='Escribe tu nombre completo';
  if(digs.length<7||digs.length>15) E.telefono='Escribe un número válido';
  if(FORM.correo && !/^\S+@\S+\.\S+$/.test(FORM.correo)) E.correo='El correo no parece válido';
  if(FORM.entrega==='envio'){ if(limpio(FORM.direccion,120).length<5) E.direccion='Escribe la dirección completa'; if(limpio(FORM.ciudad,60).length<2) E.ciudad='Escribe la ciudad'; }
  if(!FORM.medioPago) E.medioPago='Elige cómo vas a pagar';
  if(!CFG.abierta) E.general='La tienda está cerrada por ahora.';
  revisarBolsa();
  if(!CART.length) E.general='Tu bolsa quedó vacía porque las prendas se agotaron.';
  const ult=+localStorage.getItem('regia_ultimo_pedido')||0;
  if(Date.now()-ult<20000) E.general='Espera unos segundos antes de hacer otro pedido.';
  if(Object.keys(E).length){ pintarDatos(E); const f=document.querySelector('[aria-invalid="true"]'); if(f) f.focus(); return; }
  try{ localStorage.setItem('regia_datos',JSON.stringify({nombre:FORM.nombre,telefono:FORM.telefono,correo:FORM.correo,cedula:FORM.cedula,direccion:FORM.direccion,ciudad:FORM.ciudad})); }catch(e){}
  const t=totales(FORM.entrega);
  const items=CART.map(l=>{ const r=buscar(l); return {pid:r.p.id,vid:r.v.id,nombre:limpio(r.p.nombre,80),talla:limpio(r.v.talla,20),color:limpio(r.v.color,30),cantidad:l.cantidad,precio:r.v.precio}; });
  const codigo=codigoPedido();
  const doc={codigo,estado:'nuevo',creado:Date.now(),nombre,telefono:tel,cedula:limpio(FORM.cedula,20),correo:limpio(FORM.correo,80),
    entrega:FORM.entrega,direccion:FORM.entrega==='envio'?limpio(FORM.direccion,120):'',ciudad:FORM.entrega==='envio'?limpio(FORM.ciudad,60):'',
    medioPago:FORM.medioPago,notas:limpio(FORM.notas,200),items,subtotal:t.sub,envio:t.envio,total:t.total};
  enviando=true; pintarDatos();
  try{
    await baseRef.collection('pedidos').doc().set(doc);
    localStorage.setItem('regia_ultimo_pedido',String(Date.now()));
    ultimoPedido=doc; CART=[]; guardarBolsa(); enviando=false; paso='listo'; pintarListo();
  }catch(e){
    console.error(e); enviando=false;
    pintarDatos({general:'No pudimos enviar tu pedido. Revisa tu conexión e inténtalo de nuevo.'});
  }
}
function pintarListo(){
  const p=ultimoPedido, medio=(CFG.medios||[]).find(m=>m.id===p.medioPago);
  const lista=p.items.map(i=>`${i.cantidad}x ${i.nombre} (${i.talla}/${i.color})`).join('\n');
  const msg=`Hola, soy ${p.nombre}. Hice el pedido ${p.codigo} en la tienda por ${fmt(p.total)}:\n${lista}\n`+(p.entrega==='envio'?`Envío a: ${p.direccion}, ${p.ciudad}\n`:'Recojo en tienda\n')+`Pago: ${medio?medio.label:p.medioPago}`;
  const wa=CFG.whatsapp? 'https://wa.me/'+CFG.whatsapp+'?text='+encodeURIComponent(msg) : '';
  const pagoHtml=p.medioPago==='transferencia'&&CFG.datosPago?`<div class="pago"><b>Para pagar</b>${esc(CFG.datosPago)}<br><br>Total a pagar: <strong>${fmt(p.total)}</strong></div>`:`<p>Total: <strong>${fmt(p.total)}</strong></p>`;
  if(wa){
    // Paso obligatorio: el pedido se confirma enviándolo por WhatsApp a la tienda
    $('sheet-bag').innerHTML=cabBolsa('')+`<div class="done"><div class="ck">✓</div><h2>¡Ya casi! Último paso</h2><div class="cod">${esc(p.codigo)}</div>
      <p><strong>Tu pedido se confirma cuando nos lo envías por WhatsApp.</strong> Ya lleva escrito todo el detalle; solo pulsa enviar.</p>
      <a class="btn wa" id="b-wa-final" style="display:block;text-decoration:none;margin-top:16px;font-size:17px;padding:16px" href="${wa}" rel="noopener">Enviar mi pedido por WhatsApp</a>
      <p id="wa-cuenta" style="font-size:13px;margin-top:10px">Te llevamos a WhatsApp en <b>6</b> segundos…</p>
      ${pagoHtml}
      <button class="btn ghost" onclick="clearInterval(window.__waT);cerrarHojas()" style="font-size:13px">Lo envío después</button></div>`;
    let s=6; clearInterval(window.__waT);
    window.__waT=setInterval(()=>{ s--; const c=$('wa-cuenta'); if(c&&c.querySelector('b')) c.querySelector('b').textContent=s;
      if(s<=0){ clearInterval(window.__waT); if(c) c.textContent='Si WhatsApp no se abrió, pulsa el botón verde.'; location.href=wa; } },1000);
    $('b-wa-final').addEventListener('click',()=>clearInterval(window.__waT));
  } else {
    $('sheet-bag').innerHTML=cabBolsa('')+`<div class="done"><div class="ck">✓</div><h2>¡Pedido recibido!</h2><div class="cod">${esc(p.codigo)}</div>
      <p>Guarda este código. Te escribiremos al ${esc(p.telefono)} para confirmar tu pedido.</p>
      ${pagoHtml}
      <button class="btn ghost" onclick="cerrarHojas()">Seguir mirando</button></div>`;
  }
}
actualizarBolsaN();
iniciar();
</script>
